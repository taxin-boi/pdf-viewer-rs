[package]
name = "pdf-viewer-rs"
version = "0.1.0"
edition = "2021"
description = "High-performance PDF reader built with Rust, MuPDF, and egui"

[dependencies]
egui = "0.28"
eframe = "0.28"
mupdf = "0.6"
image = { version = "0.25", features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
rfd = "0.14"
directories = "5.0"
chrono = "0.4"
lru = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
